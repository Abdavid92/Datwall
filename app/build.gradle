plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

/**
 * Número de la versión oficial. Cambie la versión aquí.
 */
def officialVersionCode = 38

/**
 * Nombre de la versión oficial.
 */
def officialVersionName = "4.4.0"

base {
    archivesName = "Mis Datos-$officialVersionName-v$officialVersionCode"
}

android {
    namespace "com.smartsolutions.paquetes"
    compileSdk 35

    defaultConfig {
        applicationId "com.smartsolutions.paquetes"
        minSdkVersion 23
        targetSdkVersion 32
        versionCode officialVersionCode
        versionName officialVersionName

        testInstrumentationRunner "com.smartsolutions.paquetes.HiltTestRunner"

        resConfigs "es", "en"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "GITHUB_URL", "\"https://github.com/Abdavid92/Datwall\""
            buildConfigField "String", "APKLIS_URL", "\"https://apklis.cu/application/com.smartsolutions.paquetes\""
            buildConfigField "String", "DEVELOPERS_EMAIL", "\"apps.smartsolutions.cuba@gmail.com\""
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "GITHUB_URL", "\"https://github.com/Abdavid92/Datwall\""
            buildConfigField "String", "APKLIS_URL", "\"https://apklis.cu/application/com.smartsolutions.paquetes\""
            buildConfigField "String", "DEVELOPERS_EMAIL", "\"apps.smartsolutions.cuba@gmail.com\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // La app se distribuye por Apklis, no por Google Play
        disable 'ExpiredTargetSdkVersion'
    }
}

configurations.configureEach {
    // Bibliotecas antiguas traen kotlin-android-extensions-runtime, cuyas clases ya incluye
    // kotlin-parcelize-runtime
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(path: ':vpncore')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.1'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    //Three party libraries
    implementation 'com.github.fython:MaterialStepperView:0.2.5'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'
    // welcome 1.4.1 ya no está publicado en ningún repo oficial (era de JCenter): se usa el AAR de app/libs
    implementation 'commons-lang:commons-lang:2.4'
    implementation 'com.github.PhilJay:MPAndroidChart:3.1.0'
    // indicatorseekbar 2.1.2 ya no está publicado en ningún repo oficial (era de JCenter): se usa el AAR de app/libs
    implementation('com.github.Z17-CU:apklisupdate:v1.4') {
        // html-textview 3.9 ya no est� publicado en ning�n repo oficial (era de JCenter): se usa el AAR de app/libs
        exclude group: 'org.sufficientlysecure', module: 'html-textview'
    }

    //Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation "androidx.hilt:hilt-work:1.2.0"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"
    ksp "androidx.hilt:hilt-compiler:1.2.0"

    //Gson
    implementation 'com.google.code.gson:gson:2.8.6'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    /** rx java **/
    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.8.1'

    implementation 'com.squareup.picasso:picasso:2.71828'

    //Room database
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    //Zxing
    implementation('com.journeyapps:zxing-android-embedded:4.1.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kspAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"
}