plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

/**
 * Número de la versión oficial. Cambie la versión aquí.
 */
def officialVersionCode = 38

/**
 * Nombre de la versión oficial.
 */
def officialVersionName = "4.4.0"

base {
    archivesName = "Mis Datos-$officialVersionName-v$officialVersionCode"
}

android {
    namespace "com.smartsolutions.paquetes"
    compileSdk 37

    defaultConfig {
        applicationId "com.smartsolutions.paquetes"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode officialVersionCode
        versionName officialVersionName

        testInstrumentationRunner "com.smartsolutions.paquetes.HiltTestRunner"

        resConfigs "es", "en"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "GITHUB_URL", "\"https://github.com/Abdavid92/Datwall\""
            buildConfigField "String", "APKLIS_URL", "\"https://apklis.cu/application/com.smartsolutions.paquetes\""
            buildConfigField "String", "DEVELOPERS_EMAIL", "\"apps.smartsolutions.cuba@gmail.com\""
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "GITHUB_URL", "\"https://github.com/Abdavid92/Datwall\""
            buildConfigField "String", "APKLIS_URL", "\"https://apklis.cu/application/com.smartsolutions.paquetes\""
            buildConfigField "String", "DEVELOPERS_EMAIL", "\"apps.smartsolutions.cuba@gmail.com\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

configurations.configureEach {
    // Bibliotecas antiguas traen kotlin-android-extensions-runtime, cuyas clases ya incluye
    // kotlin-parcelize-runtime
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(path: ':vpncore')
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    //Three party libraries
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'
    // welcome 1.4.1 ya no está publicado en ningún repo oficial (era de JCenter): se usa el AAR de app/libs
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'com.github.PhilJay:MPAndroidChart:3.1.0'
    // indicatorseekbar 2.1.2 ya no está publicado en ningún repo oficial (era de JCenter): se usa el AAR de app/libs
    implementation('com.github.Z17-CU:apklisupdate:v1.4') {
        // html-textview 3.9 ya no está publicado en ningún repo oficial (era de JCenter): se usa el AAR de app/libs
        exclude group: 'org.sufficientlysecure', module: 'html-textview'
    }

    //Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation "androidx.hilt:hilt-work:1.4.0"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"
    ksp "androidx.hilt:hilt-compiler:1.4.0"

    //Gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // Retrofit, converter-gson y RxJava no los usa el código de la app: los necesita la
    // biblioteca de actualizaciones de Apklis (apklisupdate). Se declaran para fijar versiones actuales.
    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    /** rx java **/
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'

    // SMS User Consent: lee el SMS de confirmación de compra solo si el usuario lo comparte
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.3.0'

    //Room database
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kspAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"
}