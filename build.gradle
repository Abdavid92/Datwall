// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    //Libraries versions
    ext.kotlin_version = "2.4.21"
    ext.ksp_version = "2.3.12"
    ext.room_version = "2.8.5"
    ext.hilt_version = '2.60.1'
    ext.lifecycle_version = "2.11.0"

    repositories {
        google()
        mavenCentral()
        //maven {url "https://maven.aliyun.com/repository/google"}
        //maven {url "https://maven.aliyun.com/repository/jcenter"}
        //maven {url "https://maven.aliyun.com/repository/central"}

        /*maven {
            url 'http://nexus.prod.uci.cu/repository/maven-all/'
            allowInsecureProtocol = true
        }
        maven {
            url 'http://nexus.prod.uci.cu/repository/maven-central/'
            allowInsecureProtocol = true
        }
        maven {
            url 'http://nexus.prod.uci.cu/repository/jcenter/'
            allowInsecureProtocol = true
        }*/
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        //maven {url "https://maven.aliyun.com/repository/google"}
        //maven {url "https://maven.aliyun.com/repository/jcenter"}
        //maven {url "https://maven.aliyun.com/repository/central"}

        /*maven {
            url 'http://nexus.prod.uci.cu/repository/maven-all/'
            allowInsecureProtocol = true
        }
        maven {
            url 'http://nexus.prod.uci.cu/repository/maven-central/'
            allowInsecureProtocol = true
        }
        maven {
            url 'http://nexus.prod.uci.cu/repository/jcenter/'
            allowInsecureProtocol = true
        }*/
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}